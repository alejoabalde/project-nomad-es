name: Publicar NOMAD en español

# Solo del fork: arma la imagen del Centro de mando con la traducción al español
# y la publica en ghcr.io/<dueño>/project-nomad-es, que es la que bajan
# install/install_nomad_fedora.sh e install/install_nomad_arch.sh.
# No toca la imagen original de Crosstalk ni el flujo build-primary-image.yml.
#
# Después de la primera publicación, el paquete queda privado: hay que hacerlo
# público una vez desde GitHub (Your profile → Packages → project-nomad-es →
# Package settings → Change visibility → Public) para que los instaladores
# puedan bajarlo.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión (sin "v"), por ejemplo 1.35.1. Conviene usar la del NOMAD original en el que se basa.'
        required: true
        type: string
      tag_latest:
        description: 'Marcar también como :latest (la que bajan los instaladores y el script de actualización)'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Armar y publicar la imagen en español
    runs-on: ubuntu-latest
    steps:
      - name: Revisar la versión
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "La versión tiene que tener la forma 1.2.3 (sin «v»)." >&2
            exit 1
          fi

      - name: Nombre de la imagen
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ inputs.version }}
            ${{ steps.image.outputs.name }}:v${{ inputs.version }}
            ${{ inputs.tag_latest && format('{0}:latest', steps.image.outputs.name) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Project NOMAD en español (fork comunitario, no oficial)
          build-args: |
            VERSION=${{ inputs.version }}
            VCS_REF=${{ github.sha }}
