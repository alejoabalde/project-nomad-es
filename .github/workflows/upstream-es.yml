name: Aviso de versión nueva de NOMAD

# Fork-only: una vez por semana mira si NOMAD original publicó una versión
# nueva. Si hay, abre un aviso (issue) con lo que cambió y el pedido para que
# un agente una la versión, traduzca lo nuevo y deje un PR para aprobar.

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      desde:
        description: 'Solo para probar: versión base (p. ej. v1.35.0). Abre un aviso de prueba.'
        required: false
        default: ''
  # En un PR que cambia esto, solo se prueba con dos versiones ya publicadas.
  pull_request:
    paths:
      - 'tools/upstream-es/**'
      - '.github/workflows/upstream-es.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-es
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      LABEL: nomad-nuevo
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Traer las versiones de NOMAD original
        run: |
          git remote add upstream https://github.com/Crosstalk-Solutions/project-nomad.git
          git fetch --quiet upstream --tags

      - name: Probar con dos versiones ya publicadas
        if: github.event_name == 'pull_request'
        run: |
          python3 -I tools/upstream-es/check_upstream.py --desde v1.35.0 --hasta v1.35.1 \
            --salida "$RUNNER_TEMP/aviso.md"
          cat "$RUNNER_TEMP/aviso.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Buscar una versión nueva
        id: check
        if: github.event_name != 'pull_request'
        env:
          DESDE: ${{ github.event.inputs.desde }}
        run: |
          python3 -I tools/upstream-es/check_upstream.py --salida "$RUNNER_TEMP/aviso.md" \
            ${DESDE:+--desde "$DESDE"}

      - name: Abrir el aviso
        if: github.event_name != 'pull_request' && steps.check.outputs.nueva != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NUEVA: ${{ steps.check.outputs.nueva }}
          DESDE: ${{ github.event.inputs.desde }}
        run: |
          TITLE="Traducir NOMAD $NUEVA"
          [ -n "$DESDE" ] && TITLE="[Prueba] $TITLE"
          gh label create "$LABEL" --color 1D76DB \
            --description "Versión nueva de NOMAD original para unir y traducir" 2>/dev/null || true
          EXISTING=$(gh issue list --label "$LABEL" --state all --limit 100 --json title \
            --jq "map(select(.title == \"$TITLE\")) | length")
          if [ "$EXISTING" != "0" ]; then
            echo "Ya hay un aviso para $NUEVA."
            exit 0
          fi
          gh issue create --title "$TITLE" --label "$LABEL" --body-file "$RUNNER_TEMP/aviso.md"
