name: Revisar licencias (temporal)
on:
  push:
    paths: ['tools/probe/**', '.github/workflows/probe-licencias.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for u in "https://educar.arsat.com.ar/educar/app/files/repositorio/video_streaming/05/02/270f5240-dc1e-11e0-809e-ed15e3c494af/Oficioselectricidad_T01C08_HD_PA-PP-10059PA-PP-11387.mp4" "https://www.educ.ar/recursos/50643"; do
            echo "== $u"; curl -sS -m 60 -I -A "Mozilla/5.0" "$u" | head -8 || echo fallo
          done
          curl -sS -m 120 -A "Mozilla/5.0" -o /tmp/v.mp4 "https://educar.arsat.com.ar/educar/app/files/repositorio/video_streaming/05/02/270f5240-dc1e-11e0-809e-ed15e3c494af/Oficioselectricidad_T01C08_HD_PA-PP-10059PA-PP-11387.mp4" -w "bajado %{size_download} bytes en %{time_total}s\n" || true
